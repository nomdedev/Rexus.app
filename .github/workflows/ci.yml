name: CI

on:
  push:
    branches: [ main, develop, 1.0.4 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest tests/unit/obras tests/unit/vidrios tests/unit/inventario -q -o addopts='' --import-mode=importlib

      - name: Run strict auth security suite
        run: |
          python -m pytest -o addopts='' tests_strict/security/test_auth_decorators_strict.py -q

      - name: Run stable e2e workflows
        run: |
          python -m pytest -o addopts='' tests/e2e/test_workflows_completos.py tests/e2e/test_workflow_compra_completo.py -q
