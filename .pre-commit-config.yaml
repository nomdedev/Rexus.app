# 🎣 Pre-commit hooks - Automatiza calidad de código antes de cada commit
# Basado en mejores prácticas de:
# - https://pre-commit.com/
# - https://github.com/pre-commit/pre-commit-hooks

# Ver available hooks: https://pre-commit.com/hooks.html
repos:
  # ============================================================================
  # HOOKS 1: Formateo automático de código (cambia archivos)
  # ============================================================================
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Formatear código con Black
        language_version: python3.11
        args: [--config=pyproject.toml]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Ordenar imports con isort
        args: [--settings-path=pyproject.toml]

  # ============================================================================
  # HOOKS 2: Linting (no cambia archivos, solo verifica)
  # ============================================================================
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: Verificar estilo PEP 8
        args: [--config=setup.cfg]
        additional_dependencies: [
          flake8-docstrings,
          flake8-bugbear,
          flake8-comprehensions,
        ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: Verificar tipos con mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: [
          types-PyQt6,
          types-requests,
        ]

  # ============================================================================
  # HOOKS 3: Seguridad y secrets
  # ============================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Verificar vulnerabilidades de seguridad
        args: [-c, pyproject.toml]
        files: ^rexus/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detectar secrets en código
        args: [--baseline, .secrets.baseline]
        exclude: package.lock.json

  # ============================================================================
  # HOOKS 4: Calidad adicional
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Eliminar espacios en blanco al final de líneas
        args: [--markdown-line-break-extreme=2]

      - id: end-of-file-fixer
        name: Asegurar newline al final de archivos

      - id: check-yaml
        name: Verificar sintaxis YAML

      - id: check-toml
        name: Verificar sintaxis TOML

      - id: check-json
        name: Verificar sintaxis JSON

      - id: check-added-large-files
        name: Prevenir archivos muy grandes (>500KB)
        args: [--maxkb=500]

      - id: check-merge-conflict
        name: Detectar markers de merge conflict

      - id: check-case-conflict
        name: Prevenir conflictos de case sensitivity

      - id: debug-statements
        name: Prevenir statements de debug en código
        types: [python]

      - id: name-tests-test
        name: Verificar que tests empiecen con test_
        args: [--pytest-test-first]

  # ============================================================================
  # HOOKS 5: TypeScript/JavaScript (si usas frontend)
  # ============================================================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: Lint JavaScript/TypeScript
        files: \.(js|ts|jsx|tsx)$
        additional_dependencies: [
          eslint@8,
          @typescript-eslint/eslint-plugin@latest,
          typescript@latest,
        ]

# ============================================================================
  # CONFIGURACIÓN GLOBAL
# ============================================================================
default_language_version:
  python: python3.11

# No abortar en el primer fallo (ejecutar todos los hooks)
fail_fast: false

# Excluir archivos específicos
exclude: |
  (?x)^(
    \.venv/|
    venv/|
    env/|
    build/|
    dist/|
    \.eggs/|
    \.git/|
    \.mypy_cache/|
    \.tox/|
    \.pytest_cache/|
    .*\.sql
  )
