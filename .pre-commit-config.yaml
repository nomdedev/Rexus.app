repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
      - id: end-of-file-fixer
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
      - id: check-yaml
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)

  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
        args: [--max-line-length=100, --extend-ignore=E203,W503]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        exclude: ^(tests/|scripts/|examples/|backups/|reports/|\.pytest_cache/|__pycache__/|rexus_app\.egg-info/|\.git/|\.vscode/|logs/|cache/|\.claude/|sql/|resources/|config/|docs/)
        args: [--skip=B101,B601]  # Skip assert checks and shell usage for tests
