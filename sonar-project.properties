# SonarQube Configuration
sonar.projectKey=Rexus.app
sonar.projectName=Rexus.app
sonar.projectVersion=1.0.3

# Source directories
sonar.sources=rexus,main.py
sonar.tests=tests

# Exclusions
sonar.exclusions=**/*.pyc,\
  **/__pycache__/**,\
  **/tests/**,\
  **/scripts/**,\
  **/examples/**,\
  **/backups/**,\
  **/reports/**,\
  **/.pytest_cache/**,\
  **/rexus_app.egg-info/**,\
  **/.git/**,\
  **/.vscode/**,\
  **/logs/**,\
  **/cache/**,\
  **/.claude/**,\
  **/sql/**,\
  **/resources/**,\
  **/config/**,\
  **/docs/**

# Test exclusions
sonar.test.exclusions=**/*.pyc
sonar.coverage.exclusions=**/tests/**,\
  **/scripts/**,\
  **/examples/**

# Python specific settings
sonar.python.version=3.8
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-results.xml
