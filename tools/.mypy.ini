[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

exclude = (?x)(
    # Exclude test files
    tests/.*
    | scripts/.*
    | examples/.*
    | backups/.*
    | reports/.*
    | \.pytest_cache/.*
    | __pycache__/.*
    | rexus_app\.egg-info/.*
    | \.git/.*
    | \.vscode/.*
    | logs/.*
    | cache/.*
    | \.claude/.*
    | sql/.*
    | resources/.*
    | config/.*
    | docs/.*
    | .*\.pyc$
    )

[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

[mypy-examples.*]
ignore_errors = True
