# 📄 Configuración de Redis para Desarrollo
# ========================================
# Optimizado para Rexus.app con mejores prácticas de Redis Labs

# =============================================================================
# REDIS SERVER CONFIGURATION
# =============================================================================

# Bind a todas las interfaces (para desarrollo)
bind 0.0.0.0

# Modo protegido activado
protected-mode yes

# Puerto
port 6379

# Número de base de datos (0-15)
databases 16

# =============================================================================
# MEMORIA MANAGEMENT
# =============================================================================

# Máximo 256MB para desarrollo (ajustar en producción)
maxmemory 256mb

# Política de eviction: allkeys-lru (evictar keys menos usadas)
maxmemory-policy allkeys-lru

# Sampleo de keys para eviction (10 de cada 1000 keys)
maxmemory-samples 10

# =============================================================================
# SNAPSHOTTING (Persistencia)
# =============================================================================

# Guardar snapshot si hay al menos 1 key cambiado en 60 segundos
save 60 1

# Guardar snapshot si hay al menos 100 keys cambiados en 100 segundos
save 100 10

# Si se guardó al menos 1 snapshot en los últimos 60 segundos,
# no guardar si otros procesos están forzando save
save 60 1000

# Comprimir snapshots (ahorra espacio)
rdbcompression yes

# Nombre del archivo de snapshot
dbfilename dump.rdb

# Directorio de trabajo
dir /data

# =============================================================================
# LOGGING
# =============================================================================

# Nivel de log
loglevel notice

# Log a archivo (comentado en desarrollo por ahora)
# logfile "/var/log/redis/redis.log"

# Log número de conexiones desde clientes
lognotice yes

# =============================================================================
# REPLICATION
# =============================================================================

# No usar replicación en desarrollo
repl-diskless-sync no

# =============================================================================
# CLIENTES
# =============================================================================

# Máximo de clientes conectados
maxclients 10000

# Timeout de clientes inactivos (segundos)
timeout 300

# Tiempo de keepalive de TCP
tcp-keepalive 300

# =============================================================================
# SLOW LOG (Monitoreo de queries lentas)
# =============================================================================

# Loggear queries que toman más de 10 milisegundos
slowlog-log-slower-than 10000

# Máximo de 128 entries en slow log
slowlog-max-len 128

# =============================================================================
# ADVANCED CONFIG
# =============================================================================

# Hash table de tamaño (aumentar si muchas keys)
hash-max-ziplist-entries 512

# Tamaño máximo de ziplist para small sets
zset-max-ziplist-entries 128

# Activar lazy freeing
lazyfree-lazy-eviction yes

# Activar lazy freeing de objects
lazyfree-lazy-expire yes

# =============================================================================
# SECURITY (Para producción)
# =============================================================================

# En producción, descomentar:
# requirepass your_strong_password_here
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""

# En desarrollo con Docker Compose, `requirepass` se inyecta por línea de comando.
