# ⚙️ Setup.cfg - Configuración heredada para herramientas compatibles
# Herramientas que aún leen este archivo:
# - pytest (cuando no hay pyproject.toml)
# - coverage (cuando no hay pyproject.toml)
# - Algunos plugins de pytest

[bdist_wheel]
universal = 0  # No generar ruedas universales (Python 2 no soportado)

[tool:pytest]
# Configuración de pytest (respaldado por pyproject.toml)
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=rexus
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=50
    -n auto
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    security: Security tests
asyncio_mode = auto

[coverage:run]
source = rexus
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */migrations/*
    */venv/*
branch = true

[coverage:report]
precision = 2
show_missing = True
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[metadata]
name = rexus-app
version = 2.0.0
description = Sistema de Gestión Integral Rexus.app
long_description = file: README.md
long_description_content_type = text/markdown
author = Rexus.app Team
author_email = dev@rexus.app
url = https://github.com/rexus/app
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    Topic :: Office/Business
